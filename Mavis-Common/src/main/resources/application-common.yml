auth:
  jwt:
    access-exp: 3600
    refresh-exp: 604800
  oauth:
    kakao:
      redirect-url: /v1/auths/oauth/kakao
    naver:
      state: RANDOM

spring:
  mail:
    host: smtp.naver.com
    port: 465
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.naver.com

