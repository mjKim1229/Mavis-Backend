server:
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1
  port: 8080

spring:
  application:
    name: mavis-api
  profiles:
    include:
      - infrastructure
      - domain
      - common
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    aws:
      region:
        static: ap-northeast-2
logging:
  level:
    feign: DEBUG

---

# dev 환경
spring:
  config:
    activate:
      on-profile: dev
    import: "aws-parameterstore:/config/mavis/"

---

# local 환경
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:tcp://localhost/~/mavis
    username: sa
    password: 1234
logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
