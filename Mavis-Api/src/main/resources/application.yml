server:
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1
  port: 8080

spring:
  application:
    name: mavis-api
  profiles:
    include:
      - infrastructure
      - domain
      - common
  jackson:
    deserialization:
      adjust-dates-to-context-time-zone: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    aws:
      region:
        static: ap-northeast-2

---

# dev 환경
spring:
  config:
    activate:
      on-profile: dev
    import: "aws-parameterstore:/config/mavis/"

---

# local 환경
spring:
  config:
    activate:
      on-profile: local
