aws:
  region: ap-northeast-2

spring:
  mail:
    host: smtp.naver.com
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.debug: true

logging:
  level:
    feign: DEBUG

---

spring:
  config:
    activate:
      on-profile: local
discord:
  webhook:
    url: http://localhost
aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    bucket-name: ${AWS_S3_BUCKET_NAME}
